exclude: |
  (?x)
  # Only lint addons owned by this repository.
  ^(?!odoo/src/private-addons/)|
  # Ignore generated artifacts and vendored assets.
  /static/description/index\.html$|
  /static/(src/)?lib/|
  /tests/([^/]+/)?cassettes/|
  \.svg$|
  # Do not auto-edit legal texts.
  (LICENSE.*|COPYING.*)
default_language_version:
  python: python3
  node: "16.17.0"
repos:
  - repo: local
    hooks:
      # These files are most likely copier diff rejection junks; if found,
      # review them manually, fix the problem (if needed) and remove them
      - id: forbidden-files
        name: forbidden files
        entry: found forbidden files; remove them
        language: fail
        files: "\\.rej$"
      - id: en-po-files
        name: en.po files cannot exist
        entry: found an en.po file
        language: fail
        files: '[a-zA-Z0-9_]*/i18n/en\.po$'
  - repo: https://github.com/myint/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        exclude: /__manifest__\.py$|/__openerp__\.py$
        args:
          - --expand-star-imports
          - --ignore-init-module-imports
          - --in-place
          - --remove-all-unused-imports
          - --remove-duplicate-keys
          - --remove-unused-variables
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        exclude: /__manifest__\.py$|/__openerp__\.py$
        args:
          - --target-version=py310
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        name: prettier (with plugin-xml)
        additional_dependencies:
          - "prettier@2.7.1"
          - "@prettier/plugin-xml@2.2.0"
        args:
          - --plugin=@prettier/plugin-xml
        files: \.(css|htm|html|js|json|jsx|less|md|scss|toml|ts|xml|yaml|yml)$
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        verbose: true
        args:
          - --color
          - --fix
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # exclude autogenerated files
        exclude: /README\.rst$|\.pot?$
      - id: end-of-file-fixer
        # exclude autogenerated files
        exclude: /README\.rst$|\.pot?$
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        # exclude files where underlines are not distinguishable from merge conflicts
        exclude: /README\.rst$|^docs/.*\.rst$
      - id: check-symlinks
      - id: check-xml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        exclude: /__manifest__\.py$|/__openerp__\.py$
        args: ["--keep-percent-format", "--py310-plus"]
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: isort except __init__.py
        args:
          - --settings=.
        exclude: /__init__\.py$|/__manifest__\.py$|/__openerp__\.py$
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        name: flake8
        additional_dependencies: ["flake8-bugbear==24.12.12"]
        exclude: /__manifest__\.py$|/__openerp__\.py$
  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.3.23
    hooks:
      - id: pylint_odoo
        name: pylint with optional checks
        types: [python]
        exclude: /migrations/
        args:
          - --load-plugins=pylint_odoo
          - --rcfile=.pylintrc
          - --exit-zero
          - --disable=unknown-option-value
          - -j
          - "1"
        verbose: true
      - id: pylint_odoo
        name: pylint with mandatory checks
        types: [python]
        exclude: /migrations/
        args:
          - --load-plugins=pylint_odoo
          - --rcfile=.pylintrc-mandatory
          - --disable=unknown-option-value
          - -j
          - "1"
        verbose: true

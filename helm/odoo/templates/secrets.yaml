apiVersion: v1
kind: Secret
metadata:
  name: {{ template "odoo.fullname" . }}
  labels:
    app: {{ template "odoo.name" . }}
    chart: {{ template "odoo.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  {{- if .Values.s3.enabled }}
  aws-access-key-id: {{ include "odoo.existingOrRandom" (dict "root" . "name" (include "odoo.fullname" .) "key" "aws-access-key-id") | quote }}
  aws-secret-access-key: {{ include "odoo.existingOrRandom" (dict "root" . "name" (include "odoo.fullname" .) "key" "aws-secret-access-key") | quote }}
  {{- end }}
  {{- if .Values.azure.enabled }}
  azure-storage-account-url: {{ include "odoo.existingOrRandom" (dict "root" . "name" (include "odoo.fullname" .) "key" "azure-storage-account-url") | quote }}
  azure-storage-connection-string: {{ include "odoo.existingOrRandom" (dict "root" . "name" (include "odoo.fullname" .) "key" "azure-storage-connection-string") | quote }}
  {{- end }}
  odoo-admin-passwd: {{ include "odoo.existingOrRandom" (dict "root" . "name" (include "odoo.fullname" .) "key" "odoo-admin-passwd") | quote }}
  odoo-admin-user-password: {{ include "odoo.existingOrRandom" (dict "root" . "name" (include "odoo.fullname" .) "key" "odoo-admin-user-password") | quote }}
  odoo-smtp-password: {{ include "odoo.existingOrRandom" (dict "root" . "name" (include "odoo.fullname" .) "key" "odoo-smtp-password") | quote }}
---
{{- if not .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" .Release.Name "externaldb"  }}
  labels:
    app: {{ printf "%s-%s" .Release.Name "externaldb"  }}
    chart: {{ template "odoo.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  db-password: {{ include "odoo.existingOrRandom" (dict "root" . "name" (printf "%s-%s" .Release.Name "externaldb") "key" "db-password") | quote }}
{{- end }}
---
{{ if .Values.backup.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  labels:
    app: {{ template "odoo.name" . }}
    chart: {{ template "odoo.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  {{- if or (eq .Values.backup.platform "aws") (eq .Values.backup.platform "do") }}
  aws-access-key-id: {{ include "odoo.existingOrRandom" (dict "root" . "name" "backup-credentials" "key" "aws-access-key-id") | quote }}
  aws-secret-access-key: {{ include "odoo.existingOrRandom" (dict "root" . "name" "backup-credentials" "key" "aws-secret-access-key") | quote }}
  {{- end }}
  {{- if eq .Values.backup.platform "azure" }}
  azure-storage-account-url: {{ include "odoo.existingOrRandom" (dict "root" . "name" "backup-credentials" "key" "azure-storage-account-url") | quote }}
  {{- end }}
{{ end }}
---
{{ if .Values.remote.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: remote-credentials
  labels:
    app: {{ template "odoo.name" . }}
    chart: {{ template "odoo.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  {{- if or (eq .Values.remote.platform "aws") (eq .Values.remote.platform "do") }}
  aws-access-key-id: {{ include "odoo.existingOrRandom" (dict "root" . "name" "remote-credentials" "key" "aws-access-key-id") | quote }}
  aws-secret-access-key: {{ include "odoo.existingOrRandom" (dict "root" . "name" "remote-credentials" "key" "aws-secret-access-key") | quote }}
  {{- end }}
  {{- if eq .Values.remote.platform "azure" }}
  azure-storage-account-url: {{ include "odoo.existingOrRandom" (dict "root" . "name" "remote-credentials" "key" "azure-storage-account-url") | quote }}
  {{- end }}
{{ end }}

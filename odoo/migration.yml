migration:
  options:
    install_command: odoo
    install_args: --log-level=debug

  versions:
    - version: setup
      operations:
        post:
          - click-odoo songs/setup/base.py
          - /bin/sh -c "VERSION=19.0.1.0.0 click-odoo songs/environment.py"
      addons:
        upgrade:
          - contacts

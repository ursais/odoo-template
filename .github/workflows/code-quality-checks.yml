name: Code Quality Checks

on:
  pull_request:
  push:
    branches:
      - "14.0"
      - main
      - master
      - production

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Get Python version cache key
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit (PR)
        if: github.event_name == 'pull_request'
        run: >
          pre-commit run --show-diff-on-failure --color=always
          --from-ref ${{ github.event.pull_request.base.sha }}
          --to-ref ${{ github.event.pull_request.head.sha }}
      - name: Run pre-commit (push)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Branch creation and force pushes may not provide a reachable base.
          if git rev-parse --quiet --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            from_ref="${BEFORE_SHA}"
          else
            from_ref="$(git rev-parse --quiet --verify "${AFTER_SHA}^")"
          fi
          if [ -z "${from_ref}" ]; then
            echo "No usable base commit; nothing to check."
            exit 0
          fi
          pre-commit run --show-diff-on-failure --color=always \
            --from-ref "${from_ref}" --to-ref "${AFTER_SHA}"
